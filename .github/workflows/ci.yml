name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,tui]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: |
          python -c "import textual; print('textual', textual.__version__)"
          pytest tests/ -x -q -rs --tb=short -o junit_family=xunit2 --junitxml=junit.xml
          python <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          skipped = []
          for case in ET.parse("junit.xml").iter("testcase"):
              label = (case.get("classname") or "") + "." + (case.get("name") or "")
              if "tui" in label.lower() and case.find("skipped") is not None:
                  skipped.append(label)
          if skipped:
              print("ERROR: TUI tests were skipped; textual extra must be installed", file=sys.stderr)
              for name in skipped:
                  print("  " + name, file=sys.stderr)
              sys.exit(1)
          PY
