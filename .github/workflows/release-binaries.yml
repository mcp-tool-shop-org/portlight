name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  TOOL_NAME: portlight
  ENTRYPOINT: src/portlight/__main__.py

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,tui]" build

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: |
          python -c "import textual; print('textual', textual.__version__)"
          pytest tests/ -x -q -rs --tb=short -o junit_family=xunit2 --junitxml=junit.xml
          python <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          skipped = []
          for case in ET.parse("junit.xml").iter("testcase"):
              label = (case.get("classname") or "") + "." + (case.get("name") or "")
              if "tui" in label.lower() and case.find("skipped") is not None:
                  skipped.append(label)
          if skipped:
              print("ERROR: TUI tests were skipped; textual extra must be installed", file=sys.stderr)
              for name in skipped:
                  print("  " + name, file=sys.stderr)
              sys.exit(1)
          PY

      - name: Build package
        run: python -m build

      - name: Smoke-import the built wheel
        run: |
          SMOKE_DIR="$(mktemp -d)"
          python -m pip install --no-deps --force-reinstall --target "$SMOKE_DIR" dist/*.whl
          PYTHONPATH="$SMOKE_DIR" python -c "from portlight.app.cli import app; print('CLI entrypoint: OK')"
          PYTHONPATH="$SMOKE_DIR" python -c "from portlight.stress.invariants import check_all_invariants; print('Stress module: OK')"
          PYTHONPATH="$SMOKE_DIR" python -c "from portlight.balance.runner import run_balance_simulation; print('Balance module: OK')"

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: macos-latest
            target: darwin-arm64
            ext: ""
          - os: windows-latest
            target: win-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - run: uv python install 3.12

      - run: uv venv

      - name: Install dependencies + PyInstaller
        run: uv pip install . "pyinstaller>=6.9.0"

      - name: Build binary
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          uv run pyinstaller --onefile --name "${{ env.TOOL_NAME }}" --console \
            --collect-submodules rich \
            "${{ env.ENTRYPOINT }}"
          OUTNAME="${{ env.TOOL_NAME }}-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
          mv "dist/${{ env.TOOL_NAME }}${{ matrix.ext }}" "dist/${OUTNAME}"
          echo "ASSET_NAME=${OUTNAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ env.ASSET_NAME }}

  release:
    if: github.event_name == 'release'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          cd artifacts
          sha256sum * > "checksums-${VERSION}.txt"
          cat "checksums-${VERSION}.txt"

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: artifacts/*
