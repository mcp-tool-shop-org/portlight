[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portlight"
version = "2.1.0"
description = "Trade-first maritime strategy game for the terminal — TUI and CLI, twenty ports, four victory paths"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" }]
keywords = ["game", "trading", "maritime", "strategy", "xrpl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/portlight/"
Documentation = "https://mcp-tool-shop-org.github.io/portlight/handbook/"
Repository = "https://github.com/mcp-tool-shop-org/portlight"
Issues = "https://github.com/mcp-tool-shop-org/portlight/issues"
Changelog = "https://github.com/mcp-tool-shop-org/portlight/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tui = ["textual>=0.85.0"]
xrpl = ["xrpl-py>=2.0"]
printandplay = ["fpdf2>=2.8"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=5.0",
    "fpdf2>=2.8",
    "textual>=0.85.0",
    "ruff==0.15.17",
]

[project.scripts]
portlight = "portlight.app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/portlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
